[package]
name = "kbr-api-rust"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "kbr-api-rust"
path = "src/main.rs"

[lib]
name = "kbr_api_rust"
path = "src/lib.rs"

[dependencies]
actix-cors = "0.7"
actix-session = "0.11.0"
actix-web = "4.12.1"
chrono = { version = "0.4.43", features = ["serde"] }
dotenvy = "0.15.7"
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "macros", "chrono", "json"] }
thiserror = "2.0.17"
tokio = { version = "1.49.0", features = ["full"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
serde = { version = "1.0.228", features = ["derive"] }

# Auth
jsonwebtoken = "9"
bcrypt = "0.17"
actix-governor = "0.10.0"
actix-jwt-cookies = "0.1"

# S3 / Storage
rust-s3 = { version = "0.37.2", default-features = false, features = ["tokio-native-tls"] }
actix-multipart = "0.7"

# Image processing
rs-vips = "0.7"

# HTTP client
reqwest = { version = "0.12", features = ["json", "native-tls"] }
tagparser = "0.6"

# Utilities
rand = "0.8"
futures-util = "0.3"
sha256 = "1.6"
sha2 = "0.10"
hex = "0.4"

# Email
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport"] }
ammonia = "4.1.2"
percent-encoding = "2.3"
email_address = "0.2.4"

# QR Code
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
actix-http = "3"
